      <circle cx="44" cy="10" r="1.5"/><circle cx="54" cy="16" r="1.5"/>
      <circle cx="12" cy="22" r="1.5"/><circle cx="24" cy="26" r="1.5"/><circle cx="38" cy="22" r="1.5"/>
      <circle cx="50" cy="28" r="1.5"/><circle cx="6" cy="36" r="1.5"/><circle cx="18" cy="40" r="1.5"/>
      <circle cx="30" cy="36" r="1.5"/><circle cx="42" cy="42" r="1.5"/><circle cx="54" cy="40" r="1.5"/>
    </g>
  </g>
