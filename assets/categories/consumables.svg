  <g transform="translate(35,30)">
    <circle cx="35" cy="35" r="32" fill="#0F1B2D"/>
    <circle cx="35" cy="35" r="20" fill="#F77F00"/>
    <circle cx="35" cy="35" r="10" fill="#0F1B2D"/>
