<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Стремянки и лестницы">
  <rect width="200" height="140" fill="#EEF3F8"/>
  <!-- Stepladder -->
  <g transform="translate(50,18)">
    <line x1="20" y1="0" x2="0" y2="110" stroke="#0F1B2D" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="40" y2="110" stroke="#0F1B2D" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="6" x2="60" y2="110" stroke="#0F1B2D" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="6" x2="20" y2="0" stroke="#0F1B2D" stroke-width="3"/>
    <!-- rungs -->
    <line x1="6" y1="30" x2="32" y2="30" stroke="#F77F00" stroke-width="5"/>
    <line x1="10" y1="55" x2="32" y2="55" stroke="#F77F00" stroke-width="5"/>
    <line x1="13" y1="80" x2="32" y2="80" stroke="#F77F00" stroke-width="5"/>
    <!-- platform -->
    <rect x="0" y="20" width="40" height="6" fill="#F77F00"/>
  </g>
</svg>
