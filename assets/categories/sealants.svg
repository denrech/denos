<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Пены, герметики, силиконы">
  <rect width="200" height="140" fill="#E8F4EE"/>
  <!-- Foam can -->
  <g transform="translate(40,18)">
    <rect x="0" y="20" width="40" height="90" rx="6" fill="#0F1B2D"/>
    <rect x="2" y="40" width="36" height="40" fill="#F77F00"/>
    <rect x="6" y="50" width="28" height="6" fill="#fff"/>
    <rect x="6" y="60" width="22" height="4" fill="#fff" opacity="0.8"/>
    <rect x="12" y="0" width="16" height="22" rx="2" fill="#cfd6e0"/>
    <rect x="14" y="-6" width="12" height="8" fill="#cfd6e0"/>
  </g>
  <!-- Sealant tube -->
  <g transform="translate(100,30)">
    <rect x="0" y="20" width="22" height="80" rx="3" fill="#F77F00"/>
    <polygon points="0,20 22,20 18,8 4,8" fill="#0F1B2D"/>
    <polygon points="6,8 16,8 14,-2 8,-2" fill="#cfd6e0"/>
  </g>
  <!-- Cartridge -->
  <g transform="translate(140,40)">
    <rect x="0" y="10" width="20" height="70" rx="2" fill="#fff" stroke="#0F1B2D" stroke-width="2"/>
    <rect x="3" y="20" width="14" height="20" fill="#F77F00"/>
    <polygon points="6,10 14,10 10,-2" fill="#0F1B2D"/>
  </g>
</svg>
